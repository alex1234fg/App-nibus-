name: Gerar APK Android
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Aceder ao Código
        uses: actions/checkout@v3
      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Instalar Dependências e Compilar
        run: |
          npm install
          npm run build
      - name: Configurar Ambiente Android
        uses: android-actions/setup-android@v3
      - name: Gerar Pacote APK Nativo
        run: |
          npx cap init AppIlha com.ilha.onibus --web-dir dist
          npx cap add android
          npx cap sync android
          cd android && ./gradlew assembleDebug
      - name: Salvar Ficheiro APK
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
