name: Build APK Nativo

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codigo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Criar Ambiente Vite e Instalar Dependencias
        run: |
          if [ ! -f package.json ]; then
            npm create vite@latest . -- --template react
          fi

          npm install
          npm install @supabase/supabase-js leaflet lucide-react @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

          if [ -f App.jsx ]; then
            cp App.jsx src/App.jsx
          elif [ -f src/App.jsx ]; then
            echo "App.jsx encontrado em src/"
          fi

          npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Capacitor Init e Build Android
        run: |
          if [ ! -f capacitor.config.json ]; then
            npx cap init "Ilha Comprida" "com.ilhasolucoes.onibus" --web-dir dist --yes
          fi

          npx cap add android || true
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Enviar APK Gerado
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
