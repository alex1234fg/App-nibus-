name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Compilar
        run: |
          mkdir -p projeto-app
          cp App.jsx projeto-app/App.jsx || true
          cp src/App.jsx projeto-app/App.jsx || true
          cd projeto-app
          npm init -y
          npm pkg set type="module"
          npm pkg set scripts.build="vite build"
          npm install react react-dom @supabase/supabase-js leaflet lucide-react @capacitor/core
          npm install -D vite @vitejs/plugin-react @capacitor/cli @capacitor/android
          mkdir -p src
          cp App.jsx src/App.jsx || echo "import React from 'react'; export default function App() { return <h1>Erro: App.jsx nao encontrado</h1>; }" > src/App.jsx
          echo "import { defineConfig } from 'vite'; import react from '@vitejs/plugin-react'; export default defineConfig({ plugins: [react()] });" > vite.config.js
          echo "<!DOCTYPE html><html lang='pt'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><script src='https://cdn.tailwindcss.com'></script><link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'/></head><body><div id='root'></div><script type='module' src='/src/main.jsx'></script></body></html>" > index.html
          echo "import React from 'react'; import ReactDOM from 'react-dom/client'; import App from './App.jsx'; ReactDOM.createRoot(document.getElementById('root')).render(<App />);" > src/main.jsx
          npm run build
          npx cap init "App" "com.app.onibus" --web-dir dist
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: projeto-app/android/app/build/outputs/apk/debug/app-debug.apk
