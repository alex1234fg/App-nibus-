name: Build APK Nativo

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codigo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Preparar Estrutura do Projeto
        run: |
          mkdir -p src

          # Verifica se o App.jsx foi enviado na raiz e move para src/
          if [ -f App.jsx ]; then
            cp App.jsx src/App.jsx
          elif [ -f app.jsx ]; then
            cp app.jsx src/App.jsx
          fi

          # Se nem na raiz nem em src existir o App.jsx, cria um de segurança
          if [ ! -f src/App.jsx ]; then
            cat << 'EOF' > src/App.jsx
            import React from 'react';
            export default function App() {
              return <div className="p-4 text-center font-bold">App Carregado com Sucesso</div>;
            }
EOF
          fi

          # Cria o package.json otimizado
          cat << 'EOF' > package.json
          {
            "name": "ilha-comprida-onibus",
            "private": true,
            "version": "1.0.0",
            "type": "module",
            "scripts": {
              "dev": "vite",
              "build": "vite build"
            },
            "dependencies": {
              "@capacitor/android": "^5.0.0",
              "@capacitor/cli": "^5.0.0",
              "@capacitor/core": "^5.0.0",
              "@supabase/supabase-js": "^2.111.0",
              "leaflet": "^1.9.4",
              "lucide-react": "^1.28.0",
              "react": "^18.2.0",
              "react-dom": "^18.2.0"
            },
            "devDependencies": {
              "@vitejs/plugin-react": "^4.2.1",
              "vite": "^5.1.6"
            }
          }
          EOF

          # Cria o vite.config.js
          cat << 'EOF' > vite.config.js
          import { defineConfig } from 'vite'
          import react from '@vitejs/plugin-react'

          export default defineConfig({
            plugins: [react()],
          })
          EOF

          # Cria o index.html na raiz
          cat << 'EOF' > index.html
          <!doctype html>
          <html lang="pt">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Ilha Comprida Ônibus</title>
              <script src="https://cdn.tailwindcss.com"></script>
              <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.jsx"></script>
            </body>
          </html>
          EOF

          # Cria o src/main.jsx
          cat << 'EOF' > src/main.jsx
          import React from 'react'
          import ReactDOM from 'react-dom/client'
          import App from './App.jsx'

          ReactDOM.createRoot(document.getElementById('root')).render(
            <React.StrictMode>
              <App />
            </React.StrictMode>,
          )
          EOF

      - name: Instalar Dependencias e Compilar
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Capacitor e Build Android
        run: |
          npx cap init "Ilha Comprida" "com.ilhasolucoes.onibus" --web-dir dist --yes || true
          npx cap add android || true
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salvar Ficheiro APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
